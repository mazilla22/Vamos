# Ein-Datei-Android-Build für das bestehende GitHub-Repository "Vamos".
# Erst die neueste index.html ins Repository-Hauptverzeichnis hochladen.
# Dann diesen Workflow speichern unter .github/workflows/vamos-android.yml
name: "¡Vamos! APK bauen"

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/vamos-android.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Quellcode aus GitHub holen
        uses: actions/checkout@v4
      - name: Java 17 installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android-SDK vorbereiten
        uses: android-actions/setup-android@v4
      - name: Android-Buildtools installieren
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle vorbereiten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android-App-Quellen anlegen
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import base64, io, tarfile, pathlib
          src = ''''''
          with tarfile.open(fileobj=io.BytesIO(base64.b64decode(src)),mode='r:gz') as t:
            t.extractall(path='.',filter='data')
          html=pathlib.Path('index.html').read_text(encoding='utf-8')
          assert html.lower().lstrip().startswith('<!doctype html>')
          assert html.count('</head>') == 1, 'Keine HTML-Head-Endmarkierung gefunden'
          native=pathlib.Path('android-app/app/src/main/assets/native_bridge.js').read_text(encoding='utf-8')
          html=html.replace('</head>','<script>\n'+native+'\n</script></head>',1)
          pathlib.Path('android-app/app/src/main/assets/index.html').write_text(html,encoding='utf-8')
          print('HTML und Android-App-Quellen vorbereitet')
          PYTHON
      - name: APK kompilieren
        working-directory: android-app
        run: gradle --no-daemon assembleDebug
      - name: Test-APK zum Herunterladen anbieten
        uses: actions/upload-artifact@v4
        with:
          name: Vamos-Android-Test-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
